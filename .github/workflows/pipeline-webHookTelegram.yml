name: Integración Metricas y pruebas para Telegram

on:
  push:
    branches: [develop-embebido, develop, main]
  pull_request:
    branches: [develop-embebido, develop, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Verificacion de codigo
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ejecutar todos los test hasta el momento y mostrar todos los resultados
      id: tests
      continue-on-error: true  
      run: |
          mvn clean test 2>&1 | tee test-output.log
          TEST_RESULT=$(grep "Tests run:" test-output.log | tail -1 || echo "Tests run: 0, Failures: 0, Errors: 0, Skipped: 0")
          FAILED_TESTS=$(grep -B1 -E "FAILED|ERROR" test-output.log | grep "Test.*" | head -10 | tr '\n' '; ' || echo "Ninguna")
          TOTAL_TESTS=$(echo "$TEST_RESULT" | grep -oE "Tests run: [0-9]+" | grep -oE "[0-9]+" || echo "0")
          FAILURES=$(echo "$TEST_RESULT" | grep -oE "Failures: [0-9]+" | grep -oE "[0-9]+" || echo "0")
          ERRORS=$(echo "$TEST_RESULT" | grep -oE "Errors: [0-9]+" | grep -oE "[0-9]+" || echo "0")
        
          if [ "$TOTAL_TESTS" -gt 0 ]; then
            SUCCESS_RATE=$(( (TOTAL_TESTS - FAILURES - ERRORS) * 100 / TOTAL_TESTS ))
          else
            SUCCESS_RATE=0
          fi
        
          echo "test_result=$TEST_RESULT" >> $GITHUB_OUTPUT
          echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT  
          echo "success_rate=$SUCCESS_RATE" >> $GITHUB_OUTPUT
 
    - name: Construir el package con Maven
      run: mvn package -DskipTests

    - name: Enviar resultados a telegram
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          Test ejecutado ${{ job.status }} - ${{ github.repository }}
          
          Pruebas: ${{ steps.tests.outputs.test_result }}
          Tasa de exito: ${{ steps.tests.outputs.success_rate }}%
          
          Pruebas con resultado incorrecto:
          ${{ steps.tests.outputs.failed_tests }}
          
          Rama: ${{ github.ref_name }}
          Autor: ${{ github.actor }}
          Acceso: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
