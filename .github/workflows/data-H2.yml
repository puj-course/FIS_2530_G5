name: Levantar H2 Database

on:
  push:
    branches: [ main, develop-embebido ]
  pull_request:
    branches: [ main, develop-embebido ]
  workflow_dispatch:  # Permitir ejecución manual

jobs:
  build-h2:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build H2 Docker image
      run: docker build -f dockerfile.h2 -t h2-database:latest .

    - name: Start H2 container
      run: |
        docker run -d --name h2-db \
          -p 1521:1521 \
          -p 8082:8082 \
          h2-database:latest
        
        echo " Esperando a que H2 inicie..."
        sleep 10

    - name: Verify H2 is running
      run: |
        # Verificar que el contenedor está corriendo
        docker ps | grep h2-db
        
        echo " Contenedor H2 está corriendo"
        
        # Verificar logs
        echo " Logs de H2:"
        docker logs h2-db
        
        # Verificar que los puertos están expuestos
        echo " Puertos expuestos:"
        docker port h2-db

    - name: Test H2 connection
      run: |
        echo " Probando conexión a H2..."
        
        # Esperar un poco más para asegurar que H2 está listo
        sleep 5
        
        # Probar conexión TCP
        docker exec h2-db java -cp /opt/h2.jar org.h2.tools.Shell \
          -url "jdbc:h2:tcp://localhost:1521/mem:testdb" \
          -user sa \
          -password "" \
          -sql "SELECT 1 as test;" || echo " No se pudo conectar"

    - name: Show H2 access information
      run: |
        echo "╔════════════════════════════════════════════════════╗"
        echo "║         H2 DATABASE RUNNING                        ║"
        echo "╠════════════════════════════════════════════════════╣"
        echo "║  Web Console: http://localhost:8082                ║"
        echo "║  JDBC URL:    jdbc:h2:tcp://localhost:1521/testdb ║"
        echo "║  Usuario:     sa                                   ║"
        echo "║  Password:    (vacío)                              ║"
        echo "╚════════════════════════════════════════════════════╝"

    - name: Cleanup (optional - comentar si quieres mantener corriendo)
      if: always()
      run: |
        docker stop h2-db || true
        docker rm h2-db || true

  docker-compose-h2:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Start H2 with Docker Compose
      run: |
        docker-compose up -d h2-database
        
        echo " Esperando a que H2 inicie..."
        sleep 15

    - name: Verify H2 with Docker Compose
      run: |
        # Verificar estado
        docker-compose ps
        
        # Ver logs
        echo " Logs de H2:"
        docker-compose logs h2-database
        
        # Verificar health
        docker-compose ps | grep "healthy\|Up"

    - name: Test connection via Docker Compose
      run: |
        docker-compose exec -T h2-database java -cp /opt/h2.jar org.h2.tools.Shell \
          -url "jdbc:h2:tcp://localhost:1521/mem:testdb" \
          -user sa \
          -password "" \
          -sql "CREATE TABLE test(id INT); INSERT INTO test VALUES(1); SELECT * FROM test;" \
          || echo " No se pudo ejecutar prueba"

    - name: Show access information
      run: |
        echo " H2 Database está corriendo en Docker Compose"
        echo " Acceso Web: http://localhost:8082"
        echo " Puerto TCP: localhost:1521"

    - name: Cleanup
      if: always()
      run: docker-compose down -v
