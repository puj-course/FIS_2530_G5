name: Build and Test GreeNet with H2

on:
  push:
    branches: [ main, develop-embebido ]
  pull_request:
    branches: [ main, develop-embebido ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Create data directory for H2
      run: mkdir -p ./data

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests with H2
      run: mvn test
      env:
        DB_URL: jdbc:h2:file:./data/greenet;MODE=PostgreSQL;DATABASE_TO_UPPER=FALSE;AUTO_SERVER=TRUE
        DB_USERNAME: sa
        DB_PASSWORD: ""

    - name: Build Docker image
      run: docker build -t greenet-app:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run -d --name greenet-test \
          -p 8080:8080 \
          -p 8082:8082 \
          -e DB_URL=jdbc:h2:file:/data/greenet;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE \
          -e DB_USERNAME=sa \
          -e DB_PASSWORD= \
          greenet-app:${{ github.sha }}
        
        # Esperar a que la aplicación inicie
        echo "Esperando a que la aplicación inicie..."
        sleep 30
        
        # Verificar que el contenedor está corriendo
        docker ps | grep greenet-test
        
        # Verificar logs
        docker logs greenet-test
        
        # Detener y limpiar
        docker stop greenet-test
        docker rm greenet-test

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: greenet-jar
        path: target/greenet-1.0-SNAPSHOT.jar
        retention-days: 7

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/surefire-reports/
        retention-days: 7

  docker-compose-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build application
      run: mvn clean package -DskipTests

    - name: Test with Docker Compose
      run: |
        docker-compose up -d
        
        # Esperar a que la aplicación inicie
        echo "Esperando a que la aplicación inicie con docker-compose..."
        sleep 30
        
        # Verificar que el contenedor está corriendo
        docker-compose ps
        
        # Ver logs
        docker-compose logs
        
        # Verificar que H2 está funcionando (si tienes healthcheck)
        docker-compose ps | grep "healthy\|Up"
        
        # Limpiar
        docker-compose down -v

    - name: Cleanup
      if: always()
      run: docker-compose down -v
