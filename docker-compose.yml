services:
  h2-database:
    image: oscarfonts/h2
    container_name: h2-database
    ports:
      - "8082:81"  
      - "1521:1521" 
    environment:
      - H2_OPTIONS=-ifNotExists
    volumes:
      - h2_data:/opt/h2-data
    restart: unless-stopped

  greenet-app:
    build: .
    container_name: greenet-app
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:h2:tcp://h2-database:1521/~/greenet
      - DB_USERNAME=sa
      - DB_PASSWORD=
    depends_on:
      - h2-database
    restart: unless-stopped

volumes:
  h2_data: