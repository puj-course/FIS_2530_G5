version: '3.8'

services:
  h2-database:
    build:
      context: .
      dockerfile: Dockerfile.h2
    container_name: h2-database
    ports:
      - "1521:1521"  # TCP port
      - "8082:8082"  # Web console
    volumes:
      - h2_data:/opt/h2-data
    environment:
      - H2_OPTIONS=-web -webAllowOthers -tcp -tcpAllowOthers -ifNotExists -baseDir /opt/h2-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  h2_data:
